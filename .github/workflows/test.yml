name: test

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      # 元帳PDFのテストで使う日本語フォント
      - name: Install Japanese font
        run: sudo apt-get update && sudo apt-get install -y fonts-ipaexfont-gothic
      - name: Install package
        run: pip install -e ".[dev]"
      # 架空データでのテスト。本番データの照合（AOIRO_CONFIG）はリポジトリにデータがないためスキップされる
      - name: Run tests
        run: pytest -v
